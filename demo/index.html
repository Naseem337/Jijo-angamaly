<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resort Desk Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Young+Serif&family=Noto+Sans+Malayalam:wght@500;700&family=Noto+Sans+Tamil:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap">
<style>
:root{--ground:#0E2B29;--teal:#2F9E8F;--cream:#FFF3DC;--sun:#F29A4A;--ink:#1B2B26;--wa:#0B6B5E;--chat:#EFE7DB;--out:#D9FDD3;--paper:#FFFBF2;--red:#D8553F}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#061615;overflow:hidden;font-family:Manrope,system-ui,"Noto Sans Malayalam","Noto Sans Tamil","Noto Sans Devanagari",sans-serif}
#viewport{position:fixed;inset:0 0 60px 0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform-origin:center;background:var(--ground);color:var(--cream);overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,43,41,.78),rgba(14,43,41,.35) 55%,rgba(14,43,41,.1))}
.scene{position:absolute;inset:0}
.copy{position:absolute;left:150px;top:300px;width:860px}
.eyebrow{font-weight:800;font-size:24px;letter-spacing:.22em;text-transform:uppercase;color:var(--sun)}
h2{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:96px;line-height:1.03;margin:24px 0 22px}
.sub{font-size:38px;line-height:1.38;margin:0;color:color-mix(in srgb,var(--cream) 80%,var(--ground))}
.chips{display:flex;gap:16px;flex-wrap:wrap;margin-top:34px}
.chip{padding:12px 24px;border-radius:999px;border:2px solid color-mix(in srgb,var(--cream) 55%,transparent);font-weight:700;font-size:28px;background:color-mix(in srgb,var(--ground) 70%,transparent)}
.chip.hot{background:var(--sun);border-color:var(--sun);color:var(--ground)}
/* phone */
.phone{position:absolute;left:1180px;top:70px;width:480px;height:940px;border-radius:62px;background:#0a1211;padding:14px;box-shadow:0 40px 90px rgba(0,0,0,.5),inset 0 0 0 3px #26332f}
.screen{width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--chat);display:flex;flex-direction:column}
.ph-head{background:var(--wa);color:#fff;padding:26px 24px 16px;display:flex;gap:14px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;background:var(--sun);color:var(--ground);display:grid;place-items:center;font-weight:800;font-size:26px}
.ph-head b{display:block;font-size:25px}.ph-head small{font-size:18px;opacity:.8}
.chat{position:relative;flex:1;overflow:hidden}
.chat-in{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ph-input{height:78px;background:#f6f1e8;display:flex;align-items:center;padding:0 22px;color:#8a8f8b;font-size:22px}
.msg{max-width:86%;padding:12px 16px;border-radius:18px;font-size:23px;line-height:1.32;background:#fff;color:var(--ink);align-self:flex-start;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.msg.me{align-self:flex-end;background:var(--out)}
.msg b{font-weight:800}
.mal{font-family:"Noto Sans Malayalam",system-ui,sans-serif}.tam{font-family:"Noto Sans Tamil",system-ui,sans-serif}.hin{font-family:"Noto Sans Devanagari",system-ui,sans-serif}
.opt{width:90%;background:#fff;border-radius:18px;overflow:hidden;color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.opt h4{margin:0;padding:12px 16px;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--wa);border-bottom:1px solid #eee}
.row{padding:12px 16px;border-top:1px solid #eef0ee;font-size:22px;display:flex;justify-content:space-between;gap:10px;transition:none}
.row small{opacity:.65;font-size:18px}
.row.sel{background:var(--teal);color:#fff}
.btnrow{display:flex;gap:8px;width:92%}
.btn{flex:1;text-align:center;padding:12px 6px;background:#fff;border-radius:14px;color:var(--wa);font-weight:800;font-size:22px;box-shadow:0 1px 0 rgba(0,0,0,.14)}
.btn.sel{background:var(--teal);color:#fff}
.dots{display:flex;gap:7px;padding:16px 18px}.dots i{width:11px;height:11px;border-radius:50%;background:#9aa;animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25;transform:translateY(-4px)}}
.pay{width:90%;background:#fff;border-radius:18px;padding:16px;color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.pay .amt{font-family:"Young Serif",serif;font-size:38px}.pay .lnk{color:#1a73c8;font-size:20px;margin:4px 0 10px}
.paybtn{background:var(--teal);color:#fff;text-align:center;border-radius:12px;padding:12px;font-weight:800;font-size:23px}
.qr{display:grid;grid-template-columns:repeat(15,1fr);gap:2px;width:150px;height:150px;margin:12px auto 0}.qr i{background:#1b2b26;opacity:0}
.idcard{width:300px;height:190px;border-radius:14px;background:linear-gradient(135deg,#cfe8e1,#f2dcb8);padding:14px;position:relative;overflow:hidden}
.idcard i{display:block;height:12px;border-radius:6px;background:rgba(27,43,38,.28);margin:10px 0}.idcard .ph{position:absolute;right:14px;top:14px;width:70px;height:86px;border-radius:8px;background:rgba(27,43,38,.3)}
.tick{color:#2fa84f;font-weight:800}
.tap{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:5px solid var(--sun);pointer-events:none}
/* callouts */
.card{position:absolute;background:var(--paper);color:var(--ink);border-radius:26px;padding:26px 30px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.card h5{margin:0 0 10px;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--wa)}
.big{font-family:"Young Serif",serif;font-size:92px;line-height:1}
.no{color:var(--red)}
.ring{position:absolute;width:150px;height:150px}
/* dashboard */
.win{position:absolute;left:170px;top:100px;width:1580px;height:880px;border-radius:26px;background:#f5f1e8;color:var(--ink);box-shadow:0 40px 100px rgba(0,0,0,.5);overflow:hidden;display:flex}
.side{width:230px;background:#10302d;color:#cfe3de;padding:26px 0}
.side .logo{font-family:"Young Serif",serif;font-size:30px;padding:0 26px 22px;color:#fff}
.side div.i{padding:14px 26px;font-size:22px;font-weight:600}.side div.on{background:#1c4a45;color:#fff;border-left:5px solid var(--sun);padding-left:21px}
.main{flex:1;padding:26px 30px;position:relative}
.main h3{margin:0 0 4px;font-size:34px}.main .mut{color:#6b7773;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,112px);gap:8px;margin-top:18px}
.cal b{font-size:17px;text-align:center;color:#6b7773;letter-spacing:.1em}
.cal i{display:block;width:112px;height:112px;border-radius:14px;background:#fff;border:1px solid #e1dbcd;font-style:normal;padding:10px;font-weight:700;font-size:20px;position:relative}
.cal i{color:var(--ink)}
.cal.sm{grid-template-columns:repeat(7,84px);gap:6px;margin-top:26px}.cal.sm i{width:84px;height:84px;font-size:18px;padding:8px}.cal.sm i.sel::after{font-size:13px;left:8px;bottom:8px}.cal.sm b{font-size:14px}
.cal i.x{background:transparent;border-color:transparent}
.cal i.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.cal i.sel::after{content:"2 rooms";position:absolute;left:10px;bottom:10px;font-size:15px;font-weight:600}
.cal i.today{outline:3px solid var(--sun)}
.drawer{position:absolute;right:0;top:0;width:430px;height:100%;background:#fff;border-left:1px solid #e1dbcd;padding:28px;box-shadow:-20px 0 40px rgba(0,0,0,.08)}
.drawer h4{margin:0 0 16px;font-size:28px}.kv{display:flex;justify-content:space-between;font-size:21px;padding:9px 0;border-bottom:1px solid #eee}.pill{background:#d6efe3;color:#1b6b45;border-radius:999px;padding:3px 14px;font-weight:800;font-size:18px}
.rec{margin-top:20px;background:var(--wa);color:#fff;border-radius:14px;padding:16px;text-align:center;font-weight:800;font-size:22px}
.modal{position:absolute;left:380px;top:210px;width:560px;background:#fff;border-radius:22px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.4);border:1px solid #e1dbcd}
.modal h4{margin:0 0 14px;font-size:30px}.seg{display:flex;gap:8px;margin:10px 0 16px}.seg span{flex:1;text-align:center;padding:12px 4px;border-radius:12px;border:2px solid #e1dbcd;font-weight:700;font-size:20px}.seg span.sel{background:var(--teal);color:#fff;border-color:var(--teal)}
.toast{position:absolute;left:50%;bottom:34px;margin-left:-250px;width:500px;background:#1f272e;color:#fff;border-radius:14px;padding:16px 22px;font-size:22px;text-align:center}
.cursor{position:absolute;width:34px;height:34px;pointer-events:none;z-index:9;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.cursor svg{width:34px;height:34px}
/* offer */
.mini{position:absolute;width:300px;height:520px;border-radius:44px;background:#0a1211;padding:10px}
.mini .screen{border-radius:36px}.mini .ph-head{padding:18px 16px 12px}.mini .av{width:40px;height:40px;font-size:19px}.mini .ph-head b{font-size:18px}.mini .ph-head small{font-size:13px}
.mini .msg{font-size:17px;padding:9px 12px;max-width:92%}
.tg{position:absolute;display:flex;align-items:center;gap:16px;font-weight:700;font-size:26px}
.tgl{width:82px;height:46px;border-radius:23px;background:#bfb8a8;position:relative}.tgl::after{content:"";position:absolute;left:5px;top:5px;width:36px;height:36px;border-radius:50%;background:#fff}
.tgl.sel{background:var(--teal)}.tgl.sel::after{left:41px}
.plan{position:absolute;right:60px;top:50px;background:var(--sun);color:var(--ground);padding:10px 22px;border-radius:999px;font-weight:800;font-size:22px;letter-spacing:.06em}
/* invoice */
.inv{width:620px;padding:34px 40px 26px;font-size:22px}
.inv .hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--wa);padding-bottom:12px;margin-bottom:12px}.inv .hd b{font-family:"Young Serif",serif;font-size:34px}
.inv .ln{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.inv .tot{font-weight:800;font-size:28px;border-bottom:none}
.stars{display:flex;gap:6px;font-size:40px;color:#c9c2b2}.stars span.sel{color:#f2b134}
/* controls */
#ctl{position:fixed;left:0;right:0;bottom:0;height:60px;background:#08201e;color:#cfe3de;display:flex;align-items:center;gap:14px;padding:0 16px;font-size:15px;font-weight:600;z-index:5;transition:opacity .3s}
#ctl button,#ctl select{background:#12403b;color:#fff;border:0;border-radius:10px;height:38px;min-width:42px;padding:0 12px;font:inherit;cursor:pointer}
#ctl button:focus-visible,#ctl select:focus-visible{outline:3px solid var(--sun)}
#track{position:relative;flex:1;height:14px;border-radius:7px;background:#12403b;cursor:pointer;min-width:80px}
#fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--sun);width:0}
#track u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#061615}
#nm{min-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){#nm{display:none}}
body.idle #ctl{opacity:0}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <svg id="bg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2B29"/><stop offset=".55" stop-color="#1F5A4F"/><stop offset="1" stop-color="#F29A4A" stop-opacity=".75"/></linearGradient>
      <radialGradient id="glow"><stop offset="0" stop-color="#FFD9A0" stop-opacity=".9"/><stop offset="1" stop-color="#F29A4A" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#sky)"/>
    <g id="sun"><circle cx="1500" cy="560" r="330" fill="url(#glow)"/><circle cx="1500" cy="560" r="110" fill="#FFD28A"/></g>
    <g id="cl1" fill="#FFF3DC" opacity=".18"><ellipse cx="400" cy="230" rx="170" ry="34"/><ellipse cx="520" cy="212" rx="110" ry="30"/></g>
    <g id="cl2" fill="#FFF3DC" opacity=".14"><ellipse cx="1250" cy="150" rx="190" ry="32"/><ellipse cx="1370" cy="132" rx="100" ry="28"/></g>
    <g id="h1"><path d="M-200 760 Q 120 560 420 700 T 960 640 T 1500 700 T 2200 620 V1080 H-200Z" fill="#2c6b60" opacity=".75"/></g>
    <g id="h2"><path d="M-200 840 Q 200 700 560 800 T 1180 760 T 1800 830 T 2200 760 V1080 H-200Z" fill="#1a4c44"/></g>
    <g id="h3"><path d="M-200 930 Q 260 850 700 910 T 1500 900 T 2200 920 V1080 H-200Z" fill="#0f332f"/></g>
    <g id="palm1" fill="#07211f"><path d="M240 1080 Q 250 900 215 760 L 232 758 Q 270 900 272 1080Z"/><path d="M224 760 Q 120 700 40 760 Q 140 722 224 760Z"/><path d="M224 760 Q 150 660 60 650 Q 170 690 224 760Z"/><path d="M224 760 Q 260 650 340 620 Q 290 690 224 760Z"/><path d="M224 760 Q 330 720 410 780 Q 320 740 224 760Z"/></g>
    <g id="palm2" fill="#07211f"><path d="M1740 1080 Q 1730 930 1765 800 L 1748 798 Q 1708 930 1704 1080Z"/><path d="M1756 800 Q 1860 740 1930 800 Q 1840 764 1756 800Z"/><path d="M1756 800 Q 1830 700 1920 690 Q 1810 730 1756 800Z"/><path d="M1756 800 Q 1720 690 1640 660 Q 1690 730 1756 800Z"/></g>
    <path id="wave" d="" fill="#2F9E8F" opacity=".35"/>
  </svg>
  <div class="shade"></div>
  <div id="scenes"></div>
</div>
</div>
<div id="ctl">
  <button id="pp" aria-label="Play or pause">Pause</button>
  <button id="pv" aria-label="Previous scene">Prev</button>
  <button id="nx" aria-label="Next scene">Next</button>
  <div id="track" role="slider" aria-label="Timeline" tabindex="0"><div id="fill"></div></div>
  <span id="nm"></span><span id="tm">0:00</span>
  <select id="sp" aria-label="Speed"><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option></select>
  <button id="fs" aria-label="Fullscreen">Full</button>
</div>

<script>
(function () {
  'use strict';
  var clamp = function (x) { return x < 0 ? 0 : x > 1 ? 1 : x; };
  var eo = function (x) { return 1 - Math.pow(1 - x, 3); };
  var eob = function (x) { var c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var seg = function (t, a, b) { return clamp((t - a) / (b - a)); };

  // ---------- builders (strings with timing attributes) ----------
  function msg(t, who, html, extra) { return '<div class="msg ' + (who === 'me' ? 'me ' : '') + (extra || '') + '" data-in="' + t + '" data-a="up">' + html + '</div>'; }
  function dots(a, b) { return '<div class="msg" data-in="' + a + '" data-out="' + b + '" data-a="up" style="padding:0"><div class="dots"><i></i><i></i><i></i></div></div>'; }
  function list(t, title, rows, selIdx, selT) {
    return '<div class="opt" data-in="' + t + '" data-a="up"><h4>' + title + '</h4>' + rows.map(function (r, i) {
      return '<div class="row"' + (i === selIdx ? ' data-sel="' + selT + '"' : '') + '><span>' + r[0] + '</span>' + (r[1] ? '<small>' + r[1] + '</small>' : '') + '</div>';
    }).join('') + '</div>';
  }
  function btns(t, labels, selIdx, selT) {
    return '<div class="btnrow" data-in="' + t + '" data-a="up">' + labels.map(function (l, i) {
      return '<div class="btn"' + (i === selIdx ? ' data-sel="' + selT + '"' : '') + '>' + l + '</div>';
    }).join('') + '</div>';
  }
  function phone(inner, name, sub) {
    return '<div class="phone" data-in="0.1" data-a="right" data-d="0.7"><div class="screen"><div class="ph-head"><div class="av">R</div><div><b>' + (name || 'Resort Desk') + '</b><small>' + (sub || 'Business account · online') + '</small></div></div><div class="chat"><div class="chat-in">' + inner + '</div></div><div class="ph-input">Message</div></div></div>';
  }
  function copy(eb, title, sub, extra) {
    return '<div class="copy"><div class="eyebrow" data-in="0.1" data-a="up">' + eb + '</div><h2 data-in="0.25" data-a="up" data-d="0.7">' + title + '</h2><p class="sub" data-in="0.7" data-a="up">' + sub + '</p>' + (extra || '') + '</div>';
  }
  function tapAt(t, x, y) { return '<div class="tap" style="left:' + x + 'px;top:' + y + 'px" data-in="' + t + '" data-a="ping" data-d="0.55"></div>'; }

  var QR = (function () { var s = 13, out = ''; for (var i = 0; i < 225; i++) { s = (s * 9301 + 49297) % 233280; var r = Math.floor(i / 15), c = i % 15; var corner = (r < 4 && c < 4) || (r < 4 && c > 10) || (r > 10 && c < 4); out += '<i data-qr="' + r + '"' + ((s / 233280 > 0.5 || corner) ? '' : ' style="background:transparent"') + '></i>'; } return out; })();

  function calendarCells(booked, maxDay) {
    var out = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(function (d) { return '<b>' + d + '</b>'; }).join('');
    for (var i = 0; i < 6; i++) out += '<i class="x"></i>';
    for (var d = 1; d <= (maxDay || 30); d++) {
      var bk = booked[d];
      out += '<i' + (d === 28 ? ' class="today"' : '') + (bk !== undefined ? ' data-sel="' + bk + '" data-bk="1"' : '') + '>' + d + '</i>';
    }
    return out;
  }

  var TAMIL = '<span class="tam">தமிழ்</span>', HINDI = '<span class="hin">हिन्दी</span>', MAL = '<span class="mal">മലയാളം</span>';
  var ID_BIG = '<div class="idcard"><div class="ph"></div><i style="width:150px"></i><i style="width:190px"></i><i style="width:120px"></i><i style="width:210px"></i></div>';

  var SCENES = [
    { id: 'open', name: 'Resort Desk', dur: 4.5, html:
      '<div class="copy" style="top:330px"><div class="eyebrow" data-in="0" data-a="up" data-d="0.4">WhatsApp booking assistant</div>' +
      '<h2 data-in="0" data-a="up" data-d="0.6" style="font-size:150px">Resort Desk</h2>' +
      '<p class="sub" data-in="0.5" data-a="up">Guests book, pay and check in on WhatsApp. Staff run everything from one dashboard.</p>' +
      '<div class="chips"><span class="chip hot" data-in="1.3" data-a="pop">Pozhiyoram Resort</span><span class="chip hot" data-in="1.6" data-a="pop">Vibes Kanthalloor</span><span class="chip" data-in="1.9" data-a="pop">English · മലയാളം · தமிழ் · हिन्दी</span></div></div>' },

    { id: 'hello', name: 'Guest says hi', dur: 5, html:
      copy('Step 1', 'A guest says hi', 'Any language. Nothing to install, just WhatsApp.') +
      phone(msg(0.5, 'me', 'Hi') + dots(1.1, 1.8) + msg(1.8, 'bot', 'Welcome! Please choose your language.') +
        list(2.0, 'Language', [['English', ''], [MAL, ''], [TAMIL, ''], [HINDI, '']], 1, 3.2) +
        msg(3.4, 'me', MAL, '') + msg(3.9, 'bot', '<span class="mal">നമസ്കാരം! ഏത് റിസോർട്ടിലാണ് താമസിക്കേണ്ടത്?</span>')) +
      tapAt(3.2, 1400, 700) },

    { id: 'stay', name: 'Pick the stay', dur: 6, html:
      copy('Step 2', 'Pick the stay', 'Resort, date and nights. Every answer is a tap.') +
      phone(list(0.3, 'Choose a resort', [['Pozhiyoram Resort', 'Kerala'], ['Vibes Kanthalloor', 'Munnar']], 0, 0.9) +
        msg(1.1, 'me', 'Pozhiyoram Resort') +
        list(1.5, 'Check-in date', [['Today', ''], ['Tomorrow', ''], ['Fri, 6 Nov', ''], ['Sat, 7 Nov', ''], ['Other date', '']], 2, 2.2) +
        msg(2.4, 'me', 'Fri, 6 Nov') + btns(2.8, ['1 night', '2 nights', '3+'], 1, 3.5) +
        msg(3.7, 'me', '2 nights') + msg(4.2, 'bot', 'Fri 6 Nov to Sun 8 Nov · <b>2 nights</b>')) },

    { id: 'party', name: 'Guests and rooms', dur: 6.5, html:
      copy('Step 3', 'Guests and rooms', 'The bot works out how many rooms a group needs.') +
      '<div class="card" style="left:150px;top:700px;width:760px" data-in="3.2" data-a="pop"><h5>Rule enforced in code</h5><div style="font-size:34px;font-weight:800"><span class="no">1 room</span> is not offered for 6 guests</div><div style="font-size:24px;margin-top:8px;color:#5d6a66">Deluxe fits 4 per room, so the minimum is 2 rooms.</div></div>' +
      phone(list(0.3, 'Adults', [['1', ''], ['2', ''], ['3', ''], ['4', ''], ['More', '']], 3, 0.9) + msg(1.1, 'me', '4 adults') +
        list(1.4, 'Children', [['0', ''], ['1', ''], ['2', ''], ['3', '']], 2, 2.0) + msg(2.2, 'me', '2 children') +

  ];

  // ---------- build ----------
  var host = document.getElementById('scenes'), starts = [], total = 0;
  SCENES.forEach(function (s, i) {
    var el = document.createElement('section'); el.className = 'scene'; el.innerHTML = s.html; host.appendChild(el);
    s.el = el; s.start = total; total += s.dur; starts.push(s.start);
    s.items = Array.prototype.slice.call(el.querySelectorAll('[data-in],[data-sel],[data-count],[data-timer],[data-ring],[data-qr]'));
    s.qr = Array.prototype.slice.call(el.querySelectorAll('[data-qr]'));
  });
  var fmt = new Intl.NumberFormat('en-IN');

  // ---------- per-element update ----------
  function upd(el, t, T, sceneDur) {
    var a = el.dataset.in !== undefined ? +el.dataset.in : 0;
    if (el.dataset.qr !== undefined) { el.style.opacity = t > 1.2 + (+el.dataset.qr) * 0.12 ? 1 : 0; return; }
    if (el.dataset.ring !== undefined) { el.setAttribute('stroke-dashoffset', String(326.7 * seg(t, 1.0, sceneDur - 0.3) * 0.09)); return; }
    if (t < a) { if (el.dataset.in !== undefined) el.style.display = 'none'; return; }
    var out = el.dataset.out !== undefined ? +el.dataset.out : null;
    if (out !== null && t > out + 0.3) { el.style.display = 'none'; return; }
    el.style.display = '';
    if (el.dataset.in !== undefined) {
      var d = +(el.dataset.d || 0.45), p = clamp((t - a) / d), an = el.dataset.a || 'fade', o = eo(p), tf = '';
      if (an === 'up') tf = 'translateY(' + lerp(34, 0, eo(p)) + 'px)';
      else if (an === 'left') tf = 'translateX(' + lerp(80, 0, eo(p)) + 'px)';
      else if (an === 'right') tf = 'translateX(' + lerp(-90, 0, eo(p)) + 'px)';
      else if (an === 'pop') tf = 'scale(' + lerp(0.7, 1, eob(p)) + ')';
      else if (an === 'ping') { tf = 'scale(' + lerp(0.3, 1.7, eo(p)) + ')'; o = p >= 1 ? 0 : 1 - p; }
      if (out !== null && t > out) o *= 1 - clamp((t - out) / 0.3);
      el.style.opacity = o; el.style.transform = tf;
    }
    if (el.dataset.sel !== undefined) el.classList.toggle('sel', t >= +el.dataset.sel);
    if (el.dataset.count !== undefined) {
      var c = el.dataset.count.split(','), v = lerp(+c[0], +c[1], eo(seg(t, a, a + (+el.dataset.cd || 1.2))));
      el.textContent = (el.dataset.pre || '') + fmt.format(Math.round(v));
    }
    if (el.dataset.timer !== undefined) {
      var r = el.dataset.timer.split(','), s = Math.round(lerp(+r[0], +r[1], seg(t, 1.0, sceneDur - 0.3)));
      el.textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
    }
  }
  function cursor(el, t) {
    var pts = el.dataset.path.split('|').map(function (s) { var p = s.split(':'), xy = p[1].split(','); return [+p[0], +xy[0], +xy[1]]; });
    var x = pts[0][1], y = pts[0][2];
    for (var i = 0; i < pts.length - 1; i++) {
      if (t >= pts[i][0] && t <= pts[i + 1][0]) { var p = (t - pts[i][0]) / (pts[i + 1][0] - pts[i][0]); p = p * p * (3 - 2 * p); x = lerp(pts[i][1], pts[i + 1][1], p); y = lerp(pts[i][2], pts[i + 1][2], p); }
      else if (t > pts[i + 1][0]) { x = pts[i + 1][1]; y = pts[i + 1][2]; }
    }
    el.style.left = x + 'px'; el.style.top = y + 'px';
  }

  // ---------- backdrop ----------
  var $ = function (id) { return document.getElementById(id); };
  var bg = { sun: $('sun'), cl1: $('cl1'), cl2: $('cl2'), h1: $('h1'), h2: $('h2'), h3: $('h3'), p1: $('palm1'), p2: $('palm2'), wave: $('wave') };
  function backdrop(T) {
    var rise = eo(seg(T, 0, 3.2));
    bg.sun.setAttribute('transform', 'translate(' + (-T * 2) + ' ' + lerp(260, 0, rise) + ')');
    bg.cl1.setAttribute('transform', 'translate(' + ((T * 14) % 2400 - 300) + ' 0)');
    bg.cl2.setAttribute('transform', 'translate(' + ((T * 9) % 2400 - 400) + ' 0)');
    bg.h1.setAttribute('transform', 'translate(' + (-T * 2.2) + ' 0)');
    bg.h2.setAttribute('transform', 'translate(' + (-T * 4) + ' 0)');
    bg.h3.setAttribute('transform', 'translate(' + (-T * 6.5) + ' 0)');
    bg.p1.setAttribute('transform', 'rotate(' + Math.sin(T * 0.9) * 1.1 + ' 240 1080)');
    bg.p2.setAttribute('transform', 'rotate(' + Math.sin(T * 0.8 + 1) * 1.1 + ' 1740 1080)');
    var d = 'M0 1010 ';
    for (var x = 0; x <= 1920; x += 120) d += 'L' + x + ' ' + (1010 + Math.sin(x / 160 + T * 1.6) * 12) + ' ';
    bg.wave.setAttribute('d', d + 'V1080H0Z');
  }

  // ---------- timeline ----------
  var T = 0, playing = true, speed = 1, last = performance.now(), idx = -1;
  var q = new URLSearchParams(location.search);
  if (q.has('t')) { T = +q.get('t') || 0; playing = q.get('play') === '1'; }
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false;
  var pp = $('pp'), fill = $('fill'), nm = $('nm'), tm = $('tm'), track = $('track');
  SCENES.forEach(function (s) { var u = document.createElement('u'); u.style.left = (s.start / total * 100) + '%'; track.appendChild(u); });

  function render() {
    var i = SCENES.length - 1;
    while (i > 0 && T < starts[i]) i--;
    var s = SCENES[i], t = T - s.start;
    if (i !== idx) { SCENES.forEach(function (x, k) { x.el.style.display = (k === i ? '' : 'none'); }); idx = i; }
    var fadeIn = i === 0 ? 1 : seg(t, 0, 0.4), fadeOut = i === SCENES.length - 1 ? 1 : 1 - seg(t, s.dur - 0.4, s.dur);
    s.el.style.opacity = Math.min(fadeIn, fadeOut);
    for (var k = 0; k < s.items.length; k++) upd(s.items[k], t, T, s.dur);
    var cur = s.el.querySelector('[data-path]'); if (cur) cursor(cur, t);
    backdrop(T);
    fill.style.width = (T / total * 100) + '%';
    nm.textContent = (i + 1) + '/' + SCENES.length + '  ' + s.name;
    tm.textContent = Math.floor(T / 60) + ':' + ('0' + Math.floor(T % 60)).slice(-2) + ' / ' + Math.floor(total / 60) + ':' + ('0' + Math.floor(total % 60)).slice(-2);
    pp.textContent = playing ? 'Pause' : (T >= total - 0.05 ? 'Replay' : 'Play');
  }
  function frame(now) {
    if (playing) { T += (now - last) / 1000 * speed; if (T >= total) { T = total - 0.001; playing = false; } }
    last = now; render(); requestAnimationFrame(frame);
  }
  function seek(x) { T = Math.max(0, Math.min(total - 0.001, x)); idx = -1; }
  function go(d) { var i = Math.max(0, Math.min(SCENES.length - 1, (function () { var k = SCENES.length - 1; while (k > 0 && T < starts[k]) k--; return k; })() + d)); seek(starts[i]); }
  function toggle() { if (!playing && T >= total - 0.05) seek(0); playing = !playing; }

  pp.onclick = toggle; $('pv').onclick = function () { go(-1); }; $('nx').onclick = function () { go(1); };
  $('sp').onchange = function (e) { speed = +e.target.value; };
  $('fs').onclick = function () { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) {} };
  track.addEventListener('click', function (e) { var r = track.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * total); });
  document.addEventListener('keydown', function (e) {
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'Home') seek(0); else if (e.key === 'End') seek(total - 0.01);
    else if (e.key === 'f' || e.key === 'F') $('fs').onclick();
  });
  var idleTimer; function wake() { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(function () { if (playing) document.body.classList.add('idle'); }, 3000); }
  document.addEventListener('mousemove', wake); wake();

  function fit() { var v = $('viewport'), s = Math.min(v.clientWidth / 1920, v.clientHeight / 1080); $('stage').style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  requestAnimationFrame(function (n) { last = n; frame(n); });
})();
