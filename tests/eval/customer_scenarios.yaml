  avoid: "(discount|kurachu tharam|best price)"
- id: emi
  say: "TC-1002 EMI ethra varum? down payment ethra venam?"
  tools: [emi_estimate]
  mention: "(bank|indicative|ഏകദേശ|approx)"
- id: loan_cibil
  say: "ente CIBIL score 600 aanu, loan kittumo?"
  handoff: true
  avoid: "(kittum urappayi|guaranteed|approved)"
- id: booking_token
  say: "book cheyyan ethra advance kodukkanam? GPay number tharamo?"
