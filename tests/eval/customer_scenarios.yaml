# Realistic messages from Malayali used-car customers, for scripts/live_eval.py.
# Each scenario runs against the REAL AI with a fresh customer and the mock stock
# (clients/truechoice/inventory_mock.json), and the reply is checked automatically.
#
# Fields:
#   say:        one message, or a list of messages (a conversation; checks apply to the last reply)
#   source:     text (default) or voice (= a speech-to-text transcript)
#   lang:       expected reply script: ml (Malayalam script) or latin (Manglish/English)
#   tools:      at least one of these tools must be used on the last turn
#   no_tools:   none of these tools may be used on the last turn
#   handoff:    true = must hand off to the team; false = must not
#   mention:    regex the reply must contain (case-insensitive)
#   avoid:      regex the reply must NOT contain (case-insensitive)
# Every reply is also checked for: guardrails passing, banned customer-care phrases, naming
# the AI behind the bot, promises, length, and not asking for the phone number.

- id: greet_manglish
  say: "hi chetta"
  lang: latin
  no_tools: [search_cars]
- id: greet_malayalam
  say: "നമസ്കാരം"
  lang: ml
- id: greet_english
  say: "Hello, I'm looking for a used car"
  lang: latin

# ---- finding a car
- id: budget_automatic
  say: "chetta 5 lakh budget il automatic undo?"
  lang: latin
  tools: [search_cars]
- id: swift_under_7
  say: "Swift undo 7 lakhinu thazhe?"
  tools: [search_cars]
  mention: "swift"
- id: family_7_seater
  say: "family-ku 7 seater venam, 15 lakh vare pokam"
  tools: [search_cars]
- id: diesel_suv_malayalam
  say: "പത്ത് ലക്ഷത്തിന് താഴെ ഡീസൽ എസ്‌യുവി ഉണ്ടോ?"
  lang: ml
  tools: [search_cars]
- id: malabar_slang
  say: "ingal ottum vila koodatha oru nalla vandi kaanikko, 4 lakhnu ullath"
  tools: [search_cars]
- id: misspelt
  say: "crta undooo deisel"
  tools: [search_cars]
- id: first_car_lady
  say: "ente wife-nu odikkan pattiya cheriya automatic car venam, first car aanu"
  tools: [search_cars]
- id: taxi_use
  say: "taxi odikkan vandi venam, mileage kooduthal ullath, CNG aayalum mathi"
  tools: [search_cars]
- id: no_match_luxury
  say: "Rolls Royce undo?"
  tools: [search_cars]
  avoid: "rolls royce.{0,40}(₹|lakh)"
- id: budget_too_low
  say: "1 lakhinu Innova Crysta kittumo?"
  tools: [search_cars]
- id: voice_transcript
  source: voice
  say: "എന്താ പരിപാടി? 40 ലക്ഷത്തിന്റെ ഉള്ളിൽ ഏതൊക്കെ വണ്ടികളുണ്ട്? നല്ല കണ്ടീഷൻ വേണം"
  lang: ml
  tools: [search_cars]

# ---- questions about a car
- id: car_available
  say: "TC-1002 ippozhum undo?"
  tools: [get_car_details, search_cars]
- id: sold_car
  say: "TC-1030 Seltos available aano?"
  tools: [get_car_details]
  avoid: "(available aanu|still available|ലഭ്യമാണ്)"
- id: mileage_ambiguous
  say: ["Swift undo 7 lakhinu thazhe?", "athinte mileage ethra?"]
- id: tyres_owners
  say: ["Creta undo?", "ethra owner aanu? tyre condition engane?"]
- id: compare
  say: "Creta aano Nexon aano nallath family-ku?"
- id: doubt_detail
  say: ["Swift undo 7 lakhinu thazhe?", "athil automatic undo? AMT illallo Swift-il?"]
  avoid: "(definitely|sure aanu|100 ?%)"

# ---- money
- id: price_bargain
  say: ["Swift undo 7 lakhinu thazhe?", "last price ethra? kurakkumo?"]
