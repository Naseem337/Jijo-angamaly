  turns: ["Do you have pool view room?", "Book that for Dec 10, 1 night, 2 people"]
  expect:
    - "answers from room data"
    - "books the specific room type asked"
    - "not a different one"
- id: A08
  cat: booking
  turns: ["Book 1 room for tonight"]
  setup: {time: "23:30 IST"}
