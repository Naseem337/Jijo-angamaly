# Resort WhatsApp bot: test scenarios (124)
# Format matches tests/eval/customer_scenarios.yaml style.
#   turns:  customer messages in order. "voice:<lang>: ..." = send as a voice note (TTS it for tests).
#           "[staff] ..." = message from a staff number. "[wait 25h]" = clock jump.
#   setup:  state before the chat starts.
#   expect: things the bot MUST do / MUST NOT do. "lang:" = reply language/script.
#
# Language rule under test (user, 2026-11-18):
#   English in  -> English out
#   Malayalam script / Manglish / Malayalam voice note in -> Manglish TEXT
#   Tamil script / Tanglish / Tamil voice note in -> Tanglish TEXT
#   The bot NEVER sends voice replies (user, 2026-11-18). Voice notes are input only; every reply is text.
#   Language is re-detected on EVERY message; neutral msgs ("ok", "hi", "2") keep the last language.

# ───────────────────────── A. NEW BOOKING BASICS ─────────────────────────
- id: A01
  cat: booking
  turns: ["Hi, I want to book a room for 2 adults on Dec 20 for 2 nights"]
  expect:
    - "owner rule: location question first (Alleppey or Kanthalloor ?), then the form for what is missing"
    - "owner rule: ONE room by priority, never a list of options"
    - "price only in the glimpse, from data"
    - "then asks name and mobile"
    - "lang:en"
- id: A02
  cat: booking
  turns: ["room undo?"]
  expect:
    - "owner rule: location question first, then the form (Check in / Check out / Number of persons) in ONE message"
    - "lang:manglish"
- id: A03
  cat: booking
  turns: ["Dec 31 ku room venum, 4 per"]
  expect:
    - "checks New Year availability"
    - "mentions peak-season price only if tool gives it"
    - "lang:tanglish"
- id: A04
