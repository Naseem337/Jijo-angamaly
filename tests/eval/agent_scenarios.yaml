# Agent evals (docs/AI_AGENT_DESIGN.md section 7). Run: .venv\Scripts\python.exe scripts\eval_agent.py
#
# Each scenario starts from a FRESH scratch database: the seed resorts (Pozhiyoram, Alleppey: 9 Beach View AC Rooms,
# up to 3 adults, Dec season rates, extra bed 500) plus Vibes Kanthalloor (Munnar) switched ON with its 3 room types,
# fake photos, fake payments and a fake WhatsApp that only records. Today is fixed: 2026-11-25 10:00 IST (Wednesday).
#
# A turn:
#   guest:        the guest's message. Special: "[image]" / "[image] caption" = a photo; "[paid]" = the open payment
#                 link is paid at the provider (no message, no AI); "[wait 25h]" = the clock jumps.
#   expect_tools: tools that MUST be called in this turn (any order). [] = no check. Use none: true for "no tool at all".
#   expect_args:  {tool: {arg: value}}: the LAST call of that tool has these arguments (strings: case-insensitive
#                 contains; numbers: equal; dates: ISO).
#   expect_sent:  outbox keys that MUST go out this turn ("photos" matches "photos:3"; "staff" any staff alert).
#   not_sent:     outbox keys that must NOT go out ("staff" = no staff alert).
#   must_not:     words that must not appear in anything the guest got this turn (case-insensitive).
#   expect_text:  text that must appear (exactly, case-sensitive) in what the guest got.
#   outcome:      the gate's outcome (opt_out, opt_in, restart, silent, ...).
#   max_words:    the AI's OWN line has at most this many words (an empty line passes).
#   ai_empty:     true = the AI wrote no line of its own.   ai_required: true = it did write one.
#   in_order:     these keys went out in this order, others may come between ("a|b" = either).
#   only_sent:    the guest got exactly these keys (staff alerts aside).
#   no_duplicates: true = no text went twice in this turn.
# Scenario level: closed: [name, ...] = those resorts are switched OFF in the dashboard for this scenario.
# Tone (AI judge, 1-5, fail below 4): short, polite, the guest's language, answers what was asked.

# ───────────────────────── happy paths ─────────────────────────
- id: happy_en
  lang: en
  turns:
    - guest: "hi"
      expect_tools: [greet]  # the greet tool sends the owner's greeting
      expect_text: "Hi, How may I assist you?"
    - guest: "I need a room"
      expect_sent: [ask_location]
    - guest: "Alleppey"
      expect_tools: [update_enquiry]
      expect_args: {update_enquiry: {place: alleppey}}
      expect_sent: [form]
    - guest: "Dec 12 to Dec 14, 2 adults"
      expect_tools: [update_enquiry]
      expect_args: {update_enquiry: {check_in: "2026-12-12", check_out: "2026-12-14", adults: 2}}
      expect_sent: [rooms_ok, ask_contact]
      must_not: ["confirmed", "booked"]
    - guest: "Rahul 9847011111"
      expect_tools: [create_booking]
      expect_args: {create_booking: {mobile: "9847011111"}}
      expect_sent: [summary, pay]
      must_not: ["RB-"]  # the name is in the owner's summary ("Guest - Rahul"): that is right

