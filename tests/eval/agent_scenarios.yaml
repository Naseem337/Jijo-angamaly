# moved from resort_scenarios.yaml N07
- id: guest_called
  turns:
    - guest: "Hi"
    - guest: "Alleppey Dec 10-12, 2 adults"
    - guest: "I already called the owner"
      expect_tools: [talk_to_owner]
      expect_args: {talk_to_owner: {reason: guest_called}}
