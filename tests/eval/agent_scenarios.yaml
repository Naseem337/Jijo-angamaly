# ───────────────────────── price, discount, many questions ─────────────────────────
- id: price_asked
  turns:
    - guest: "Alleppey dec 10 to 12, 2 adults"
    - guest: "what is the price?"
      expect_tools: [get_price]
      expect_sent: [price_answer]

- id: discount_once_then_twice
  turns:
    - guest: "Alleppey dec 10 to 12, 2 adults"
    - guest: "can you give some discount?"
      not_sent: [handoff, staff]
      must_not: ["no discount"]
    - guest: "please, give a lower rate"
      expect_tools: [talk_to_owner]
      expect_args: {talk_to_owner: {reason: other}}
      expect_sent: [handoff]

- id: three_questions_one_message
  turns:
    - guest: "Is there a pool? Do you allow pets? Is breakfast included? Can we have a campfire?"
      expect_tools: [talk_to_owner]
      expect_args: {talk_to_owner: {reason: cannot_answer}}
      expect_sent: [handoff]
      not_sent: [staff]  # fix round 2: no staff alert for cannot_answer

- id: call_request  # fix round 1: the reason is an enum with its fixed text
  turns:
    - guest: "can I talk to the owner?"
      expect_tools: [talk_to_owner]
      expect_args: {talk_to_owner: {reason: call_request}}
      expect_sent: [handoff]
      not_sent: [staff]  # fix round 2: no staff alert for call_request
      must_not: ["call you back", "will contact you"]
      expect_text: "Please contact the team directly"

- id: policy_in_facts  # fix round 2: a policy FACTS has -> one short line, no handoff
  turns:
    - guest: "can we order food at the Alleppey resort?"
      not_sent: [handoff, staff]

- id: policy_not_in_facts  # fix round 2: a policy FACTS lacks -> talk_to_owner(cannot_answer), never a guess
  turns:
    - guest: "are pets allowed at the Alleppey resort?"
      expect_tools: [talk_to_owner]
      expect_args: {talk_to_owner: {reason: cannot_answer}}
      expect_sent: [handoff]
      not_sent: [staff]

