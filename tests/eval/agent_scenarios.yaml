      must_not: ["no record", "didn't catch", "call you back", "will contact you"]

# ───────────────────────── conversation ─────────────────────────
- id: mid_chat_hi  # the name ask is already our last message: never re-sent
  turns:
    - guest: "Alleppey dec 10 to 12, 2 adults"
    - guest: "hi"
      not_sent: [ask_contact]
      must_not: ["How may I assist you", "assist"]

- id: question_then_open_step  # fix round 1: code closes the turn with the open step
  turns:
    - guest: "Alleppey dec 10 to 12, 2 adults"
    - guest: "is there parking?"
      expect_sent: [ask_contact]

- id: question_with_link_open  # fix round 1: the open payment link follows the answer
  turns:
    - guest: "Alleppey dec 10 to 12, 2 adults"
    - guest: "Meera 9847044444"
    - guest: "is check-in at 12?"  # the link is among our last 2 messages: the answer only, no link again
      ai_required: true
      not_sent: [summary, pay]

- id: thanks_with_link_open
  turns:
    - guest: "Alleppey dec 10 to 12, 2 adults"
    - guest: "Meera 9847044444"
    - guest: "ok thanks"
      not_sent: [summary, staff, handoff]
      must_not: ["confirmed", "booked"]

- id: unrelated_question
  turns:
    - guest: "who won the football world cup?"
      not_sent: [handoff, staff]

- id: stop_start
  turns:
    - guest: "STOP"
      outcome: opt_out
    - guest: "START"
      outcome: opt_in

- id: restart
  turns:
    - guest: "Alleppey dec 10 to 12, 2 adults"
    - guest: "restart"
      outcome: restart
      expect_text: "Hi, How may I assist you?"
    - guest: "I need a room"
      expect_sent: [ask_location]
      expect_tools: [update_enquiry]  # fix round 3: the AI sees its greeting after the restart, never greets again
      must_not: ["How may I assist"]

# ───────────────────────── fix round 3 ─────────────────────────
- id: not_our_place  # a town with no resort: the owner's fixed text with the dashboard towns, the AI adds nothing
  turns:
    - guest: "I am looking for a property in kochi"
      expect_tools: [update_enquiry]
      expect_sent: [not_our_place]
      expect_text: "Sorry, we have properties only in Alleppey and Kanthalloor."
      must_not: ["listings", "anything else"]

- id: place_never_guessed  # the AI may not fill a place the guest did not write: the location question goes
  turns:
    - guest: "I need a room for 2 on dec 10 to 12"
      expect_tools: [update_enquiry]
      expect_sent: [ask_location]
      not_sent: [form, rooms_ok]

- id: check_out_next_month  # {day: 30} / {day: 2}: code builds 30 Nov -> 2 Dec
  turns:
    - guest: "Alleppey 30 to 2, 2 adults"
      expect_tools: [update_enquiry]
      expect_args: {update_enquiry: {check_in: "2026-11-30", check_out: "2026-12-02"}}
      expect_sent: [rooms_ok]

- id: room_labels_each_room  # 4 adults -> 2 rooms: a label for EACH room, by its room number
  turns:
    - guest: "Alleppey dec 10 to 12, 4 adults"
      expect_sent: [rooms_ok, glimpse, room_label, ask_contact]
      expect_text: "*Room 102 - Beach View AC Room*"
      not_sent: [room_picked]

- id: other_room_shown_not_switched  # asking about another room only shows it
  turns:
    - guest: "Kanthalloor dec 12 to 14, 2 adults"
      expect_sent: [rooms_ok, room_label]
    - guest: "do you have a deluxe room also?"
      expect_tools: [send_photos]
      expect_sent: [other_room_free, room_label]
      not_sent: [room_picked, summary]

- id: short_human_reply  # no bot phrases in the AI's own words
  turns:
    - guest: "how is the weather in december?"
      not_sent: [handoff, staff]
      must_not: ["anything else", "feel free", "as an AI", "owner", "don't hesitate", "please note"]

# ───────────────────────── fix round 4 ─────────────────────────
- id: closed_place_then_yes  # Kanthalloor switched off: closed_place; "yes" -> the location question (AI asks nothing itself)
  closed: [Kanthalloor]
  turns:
    - guest: "Vibes Kanthalloor"
      expect_sent: [closed_place]
    - guest: "yes"  # after closed_place: the location question again
      expect_sent: [ask_location]
      must_not: ["check-in", "check-out", "adults", "dates"]
    - guest: "ok"
      not_sent: [form, ask_location]
      max_words: 10

- id: not_our_place_2  # Munnar is NOT used here: in the dashboard Munnar is Kanthalloor's own town (see the next one)
  turns:
    - guest: "do you have rooms in ooty?"
      expect_tools: [update_enquiry]
      expect_sent: [not_our_place]
      must_not: ["listings", "anything else"]

- id: munnar_is_kanthalloor  # Kanthalloor's place is "Kanthalloor, Munnar": munnar is ours, never not_our_place
  turns:
    - guest: "do you have rooms in munnar?"
      expect_tools: [update_enquiry]
      expect_sent: [form]
      not_sent: [not_our_place, ask_location]

- id: short_answer
  turns:
    - guest: "is there a pool?"
      max_words: 20

- id: rooms_check_labels  # the owner's order after a room check, a label per room, never room_picked
  turns:
    - guest: "Alleppey"
      expect_sent: [form]
    - guest: "12 dec to 15 dec, 4 ppl"
      in_order: [rooms_ok, rooms_plain|rooms_note|rooms_beds, glimpse, room_label, photos, room_label, photos, ask_contact]
      expect_text: "*Room 102 - Beach View AC Room*"
      not_sent: [room_picked]

- id: one_room_for_four  # 1 room for 4 adults: the owner's min-rooms text, 2 rooms checked
  turns:
    - guest: "Alleppey"
    - guest: "12 dec to 15 dec, 4 ppl, 1 bedroom enough"
      expect_sent: [min_rooms, rooms_ok]
      expect_text: "2 room(s)"
      must_not: ["₹", "advance"]

- id: ok_after_contact_ask  # "ok" right after the name ask: no repeat, a tiny line or nothing
  turns:
    - guest: "Alleppey dec 10 to 12, 2 adults"
      expect_sent: [ask_contact]
    - guest: "ok"
      not_sent: [ask_contact]
      max_words: 10

- id: photos_after_link  # photos are always allowed, also with a link open; already sent -> photos_sent
  turns:
    - guest: "Alleppey dec 10 to 12, 4 adults"
    - guest: "Meera 9847044444"
      expect_sent: [summary, pay]
    - guest: "send room pics"  # all its photos already went: never re-sent
      expect_tools: [send_photos]
      expect_sent: [photos_sent]
      expect_text: "All the photos are sent above."
      not_sent: [photos]
      must_not: ["not free", "can't share"]

- id: other_room_then_choose  # 'any other room?' only shows it; 'take that one' switches, closes the link, new link
  turns:
    - guest: "Kanthalloor dec 12 to 14, 2 adults"
      expect_sent: [rooms_ok]
    - guest: "Meera 9847044444"
      expect_sent: [summary, pay]
    - guest: "any other room?"
      expect_tools: [send_photos]
      in_order: [other_room_free, room_label, photos]
      not_sent: [room_picked, summary]
    - guest: "ok take that one"
      expect_tools: [update_enquiry]
      expect_args: {update_enquiry: {room_picks: deluxe}}
      in_order: [room_picked, summary, pay]

- id: casual_photos
  turns:
    - guest: "Alleppey dec 10 to 12, 2 adults"
    - guest: "Meera 9847044444"
    - guest: "pics?"
      expect_tools: [send_photos]
      must_not: ["can't share"]

- id: no_expiry_talk
  turns:
    - guest: "Alleppey dec 10 to 12, 2 adults"
    - guest: "Meera 9847044444"
      expect_tools: [create_booking]
      expect_sent: [summary, pay]
      must_not: ["minutes", "expire"]

- id: paid_not_paid  # the guest says paid, the provider says not yet: the owner's text only
  turns:
    - guest: "Alleppey dec 10 to 12, 2 adults"
    - guest: "Meera 9847044444"
    - guest: "paid"
      expect_tools: [check_payment]
      expect_sent: [pay_wait]
