# True Choice: pre-owned cars, Kerala.
# ${VAR} values come from the environment (.env locally, Lambda env on AWS).
# *_secret values are secret NAMES (env var locally, Secrets Manager on AWS), never values.

client_id: truechoice
display_name: True Choice
assistant_name: True Choice virtual assistant
bot_name: Anees          # the name the bot uses in chat
city: Makkaraparamba, Malappuram, Kerala
languages: [ml, manglish, en]

# Staff WhatsApp numbers allowed to send RESUME / LEAD and receive handoff summaries.
# Comma-separated in .env: TRUECHOICE_STAFF_NUMBERS=+9198xxxxxxxx,+9194xxxxxxxx
staff_numbers: "${TRUECHOICE_STAFF_NUMBERS}"

whatsapp:
  phone_number_id: "${TRUECHOICE_WHATSAPP_PHONE_NUMBER_ID:-not-set}"
  graph_api_version: v25.0
  access_token_secret: truechoice/whatsapp_token
  app_secret_secret: truechoice/whatsapp_app_secret
  verify_token_secret: truechoice/whatsapp_verify_token
  # Names must match the templates approved in Meta (see docs/whatsapp_templates.md).
  # All Utility; car_alert_1 has a photo header (the car's main photo).
  templates:
    car_alert_1: tc_car_alert_1
    car_alert_2: tc_car_alert_2
    car_alert_3: tc_car_alert_3
    staff_lead_alert: tc_staff_lead_alert
  # English only for now (user, 2026-10-21); add ml when Malayalam versions are approved.
  template_languages: {ml: en, en: en, manglish: en}

inventory:
  # carlet = True Choice's app backend (api.carlet.in, read-only, same stock as the app);
  # google_sheet = their Google Sheet; mock = inventory_mock.json below (tests, offline).
  # Chosen in .env: TRUECHOICE_INVENTORY_ADAPTER=carlet
  adapter: "${TRUECHOICE_INVENTORY_ADAPTER:-mock}"
  options:
    path: inventory_mock.json   # mock: relative to this folder
    sheet_id: "${TRUECHOICE_INVENTORY_SHEET_ID}"   # the long id in the sheet's URL
    gid: "${TRUECHOICE_INVENTORY_SHEET_GID}"       # which tab: the number after gid= in its URL; empty = first tab
    cache_seconds: 300          # re-read the stock at most every 5 minutes
    # carlet:
    base_url: https://api.carlet.in
    id_prefix: "TC-"            # short car ids shown to customers: TC-A72F0B
    showrooms: []               # [] = all showrooms; or e.g. [Makkaraparamba]
    # True Choice's "Location" column is the city the car is REGISTERED in, not where it
    # is parked (all cars are at the showroom).
    columns: {registration: Location}

providers:
  llm:
    deepseek:
      kind: openai_compatible
      base_url: https://api.deepseek.com
      model: deepseek-chat
      api_key_secret: deepseek_api_key
    openrouter:
      kind: openai_compatible
      base_url: https://openrouter.ai/api/v1
      model: "${OPENROUTER_MODEL}"
      api_key_secret: openrouter_api_key
    gemini:
      kind: openai_compatible
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: "${GEMINI_MODEL}"
      api_key_secret: gemini_api_key
      timeout_s: 12                    # free tier sometimes hangs; hand over to the backup quickly
      thinking_headroom_tokens: 2048   # Gemini 3.x thinking counts against max_tokens
      extra: {reasoning_effort: low}
    gemini_backup:                     # an older Gemini, used when the main one is overloaded
      kind: openai_compatible
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: "${GEMINI_BACKUP_MODEL}"
      api_key_secret: gemini_api_key
      timeout_s: 12
      thinking_headroom_tokens: 2048
      extra: {reasoning_effort: low}
    # Groq free tier (2026-10-21: Google blocked the Gemini account). Model names in .env;
    # check them with: python -m app.providers.llm --client truechoice --each
    groq:
      kind: openai_compatible
      base_url: https://api.groq.com/openai/v1
      model: "${GROQ_MODEL:-openai/gpt-oss-120b}"
      api_key_secret: groq_api_key
      timeout_s: 20
      thinking_headroom_tokens: 1024   # gpt-oss reasons before answering
      extra: {reasoning_effort: low}
    groq_backup:
      kind: openai_compatible
      base_url: https://api.groq.com/openai/v1
      model: "${GROQ_BACKUP_MODEL:-openai/gpt-oss-20b}"   # own per-minute limit; Qwen's Malayalam was poor
      api_key_secret: groq_api_key
      timeout_s: 20
      thinking_headroom_tokens: 1024
      extra: {reasoning_effort: low}
    anthropic:
      kind: anthropic
      model: "${ANTHROPIC_MODEL}"   # fill in the current Claude Haiku model ID in .env
      api_key_secret: anthropic_api_key
  # Order to try providers in. Override in .env, e.g. LLM_CHAIN=gemini (free tier, testing only).
  llm_chain: "${LLM_CHAIN:-deepseek,openrouter,anthropic}"
  # Sarvam model/speaker names are verified against the live API in step 7.
  stt:
    kind: sarvam
    api_key_secret: sarvam_api_key
    model: "${SARVAM_STT_MODEL:-saaras:v4}"   # checked live 2026-10-18; 30 s per request
    language_code: unknown        # auto-detect ml / en / code-mixed
    # Spelling hints so car names come out right (Sarvam allows up to 50).
    keyterms: [Maruti, Suzuki, Hyundai, Tata, Mahindra, Toyota, Honda, Kia, Skoda, Volkswagen,
               Renault, Nissan, MG, Swift, Dzire, Baleno, Wagon R, Ertiga, Brezza, Alto, Celerio,
               Creta, Venue, Verna, i20, i10, Innova, Innova Crysta, Fortuner, Glanza, City,
               Amaze, XUV700, XUV300, Scorpio, Thar, Nexon, Punch, Tiago, Seltos, Sonet, EMI,
               SUV, sedan, hatchback, automatic, diesel, petrol, CNG, True Choice]
  # Main voice: Gemini "Algenib", a mature male voice the user approved by ear (sample:
  # data/voice_samples/algenib_B_director.wav; transcript-checked: no instruction spoken).
  # When Gemini fails (free-tier quota), tts_backup (Sarvam anand) speaks instead.
  tts:
    kind: gemini
    api_key_secret: gemini_api_key
    model: "${GEMINI_TTS_MODEL:-gemini-3.8-flash-tts}"
    speaker: "${GEMINI_TTS_VOICE:-Algenib}"
    # Pleasant and steady (user, 2026-10-20: "not too harsh, not too bird-like").
    style: >-
      pleasant, friendly and gentle; medium pitch, not high or squeaky; steady, even volume,
      never harsh or shouting; relaxed, natural pace, like a kind, experienced salesman.
  # One voice only, so the tone never changes: if Gemini can't speak (e.g. free-tier quota),
  # the customer gets the text instead of a different voice. To use Sarvam instead, move this
  # block up to `tts:` (voices: anand, gokul, vijay; samples in data/voice_samples/pleasant).
  tts_sarvam_option:
    kind: sarvam
    api_key_secret: sarvam_api_key
    # Only bulbul:v3 speaks Malayalam (checked 2026-10-19). Voices to try (samples in
    # data/voice_samples): kavya, priya, shreya, kavitha (female); anand, gokul (male).
    model: "${SARVAM_TTS_MODEL:-bulbul:v3}"
    language_code: ml-IN
    speaker: "${SARVAM_TTS_SPEAKER:-anand}"   # male, to match bot_name Anees
    pace: 1.0
    temperature: 0.4         # low = the same steady tone every time

voice:
  policy: mirror          # reply with voice only if the customer sent voice or asked
  max_audio_seconds: 60
  tts_timeout_s: 25        # Gemini took 6–11 s, Sarvam ~5 s; the text is sent first anyway
  daily_char_cap: 20000

# Yard-visitor leads (staff command: LEAD <phone> <what they want>).
leads:
  expiry_days: 90          # stop alerting after this many days

dashboard:
  password_secret: truechoice/dashboard_password
