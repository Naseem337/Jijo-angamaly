# True Choice business rules. Edit freely; validated by app/core/client_config.py.
# Values marked (default) are placeholders until True Choice confirms them.

business_hours:            # (default) used for handoff wording ("tomorrow morning")
  days: [mon, tue, wed, thu, fri, sat]
  open: "09:30"
  close: "19:00"

emi:                       # (default) indicative only; never a loan approval
  annual_rate_min_pct: 10.5
  annual_rate_max_pct: 14.0
  tenure_months_options: [12, 24, 36, 48, 60]
  default_down_payment_pct: 20
  disclaimer_en: "This is only an indicative estimate. Final EMI depends on the bank's approval and terms."
  disclaimer_ml: "ഇത് ഏകദേശ കണക്ക് മാത്രമാണ്. അന്തിമ EMI ബാങ്കിന്റെ അംഗീകാരത്തെയും നിബന്ധനകളെയും ആശ്രയിച്ചിരിക്കും."

alerts:
  send_window: {start: "09:00", end: "20:00"}   # IST
  global_daily_cap: 200
  max_cars_per_message: 3
  max_unanswered: 3          # then one "still looking?" then expire
  requirement_ttl_days: 60
  reply_context_hours: 72    # a reply within this window gets the alert as context
  near_match:
    budget_over_pct: 10
    years_older: 1
    max_per_days: 7

bot:
  auto_resume_hours: 24      # paused (handed-off) chats resume after this
  history_messages: 20       # messages of history sent to the LLM

retention_days: 90           # messages/audio metadata older than this are deleted

# Added to the built-in stop / venda / not interested lists.
opt_out_extra_phrases: []

# Facts about True Choice the bot may tell customers, in plain words, one per line.
# Anything NOT listed here (or in the stock sheet) the bot answers with "the team will confirm".
# (placeholder) items need checking by True Choice before go-live.
dealer_facts:
  - "Showroom: True Choice, Makkaraparamba, Malappuram, Kerala (exact address / Google Maps link: the team shares it)."
  - "All listed cars are at the showroom; the registration city in the stock list is only where the car is registered."
  - "Open Monday to Saturday, 9:30 AM to 7:00 PM. Closed on Sunday."
  - "Test drives are only for customers who visit the yard/showroom; no home test drives or bringing cars to the customer."
  - "We accept the customer's old car in exchange; its value is decided only after the team inspects it."
  - "We also buy cars from customers (outright purchase, no need to buy one from us); price only after inspection."
  - "(placeholder) Loans can be arranged through partner banks/NBFCs; approval and rate depend on the bank."

# How the bot talks: dialect, slang and politeness, written in plain words. It shapes both
# the text replies and the voice notes. Edit freely, then restart the bot.
speaking_style: >
  Friendly, warm everyday Kerala Malayalam, the way an experienced, trusted salesman at a
  Malappuram showroom talks to a customer: colloquial, never newspaper or textbook Malayalam.
  A light Malabar flavour is fine, but keep it easy for any Keralite to follow.
  Respectful (use "ningal", never "nee"); call the customer "sir" or "madam" when you can
  tell which, never "chetta"/"chechi" or their name. Use common English car words as people say them
  (car, budget, EMI, test drive, automatic, diesel). Keep it short and natural.

model_aliases:
  swift: [maruti swift, suzuki swift, swift dzire]
  dzire: [swift dzire, maruti dzire]
  baleno: [maruti baleno]
  wagon r: [wagonr, wagon-r]
  innova crysta: [crysta, innova]
  creta: [hyundai creta]
  i20: [i 20, elite i20]
  xuv700: [xuv 700, xuv7oo, xuv 7oo]
  nexon: [tata nexon]
  city: [honda city]
  ertiga: [maruti ertiga]
