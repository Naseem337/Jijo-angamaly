# Resort booking bot (WhatsApp). Loaded by app/resort/config.py, NOT by the car-dealer loader
# (that one only reads folders with a client.yaml), so the True Choice bot is untouched.
# ${VAR} values come from the environment (.env locally). Secrets are only NAMES here.

client_id: resort
display_name: Resort Booking Assistant
bot_name: Resort Assistant       # shown to guests; change to the client's brand
languages: [en, ml, ta, hi]
hold_minutes: 15                 # rooms are held this long while the guest pays
agent_mode: "${AGENT_MODE:-old}" # old = today's bot | shadow = old answers, the AI-first agent runs dry | agent = AI-first (docs/AI_AGENT_DESIGN.md)
max_audio_seconds: 0             # 0 = no limit (owner, 2026-11-20); long notes are cut into pieces

# AI-6 owner test (AGENT_MODE=agent only): only these guest phones get the agent (comma-separated); others get no reply.
# Empty = the agent answers everyone.
agent_test_phones: "${AGENT_TEST_PHONES:-}"
# Test setup: when set, staff alerts go ONLY to these numbers (instead of RESORT_STAFF_NUMBERS + the dashboard's).
staff_alert_phones: "${STAFF_ALERT_PHONES:-}"

# Staff numbers that always get booking alerts (comma-separated, E.164) besides each property's own.
staff_numbers: "${RESORT_STAFF_NUMBERS}"

# Approved WhatsApp template names, used only when a free text can't be sent (guest silent > 24 h).
templates:
  paid: "${RESORT_TPL_PAID:-}"
  failed: "${RESORT_TPL_FAILED:-}"
  pending: "${RESORT_TPL_PENDING:-}"

speaking_style: >
  Warm, polite and very brief, like a good resort front-desk host on WhatsApp. Plain words, no slang.
  Reply in the guest's own language, in English letters.

providers:
  llm:
    anthropic:                      # the agent's main brain (Claude Haiku). Key: ANTHROPIC_API_KEY, model: AGENT_MODEL
      kind: anthropic
      model: "${AGENT_MODEL:-}"     # never hard-coded: empty -> skipped with a log line, the next provider answers
      api_key_secret: anthropic_api_key
      timeout_s: 20
      extra: {thinking: {type: disabled}}   # no extended thinking (temperature is not accepted by Claude's API)
    deepseek:                     # paid, cheap; the go-live brain (owner, 2026-11-18). Key: DEEPSEEK_API_KEY
      kind: openai_compatible
      base_url: https://api.deepseek.com
      model: "${DEEPSEEK_MODEL:-deepseek-chat}"
      api_key_secret: deepseek_api_key
      timeout_s: 30
    gemini:
      kind: openai_compatible
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: "${GEMINI_MODEL:-gemini-3.5-flash}"
      api_key_secret: gemini_api_key
      timeout_s: 12
      thinking_headroom_tokens: 2048
      extra: {reasoning_effort: low}
    sarvam_chat:
      kind: openai_compatible
      base_url: https://api.sarvam.ai/v1
      model: "${SARVAM_CHAT_MODEL:-sarvam-105b-conversations}"
      api_key_secret: sarvam_api_key
      timeout_s: 30
    groq:
      kind: openai_compatible
      base_url: https://api.groq.com/openai/v1
      model: "${GROQ_MODEL:-openai/gpt-oss-120b}"
      api_key_secret: groq_api_key
      timeout_s: 20
      thinking_headroom_tokens: 1024
      extra: {reasoning_effort: low}
  llm_chain: "${LLM_CHAIN:-anthropic,sarvam_chat,groq}"  # Claude first; Sarvam, then Groq on an error
  stt:
    kind: sarvam
    api_key_secret: sarvam_api_key
    model: "${SARVAM_STT_MODEL:-saaras:v4}"
    language_code: unknown      # auto-detect en / ml / ta / hi
    keyterms: [resort, room, deluxe, villa, cottage, check-in, check-out, Pozhiyoram, Vibes, Kanthalloor]
  tts:                          # unused: this bot never sends voice (user rule)
    kind: sarvam
    api_key_secret: sarvam_api_key
