[project]
name = "dealer-whatsapp-agent"
version = "0.1.0"
description = "Multi-client WhatsApp AI agent for pre-owned car dealerships"
# Lambda runs 3.12; keep the code 3.12-compatible even if you develop on 3.13.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "phonenumbers>=8.13",
    "httpx>=0.27",
    "anthropic>=1.15",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "openpyxl>=3.1",  # scripts/export_db.py
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
